name: tests

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          # no Python 3.9 build for the arm64 macOS runners; Ubuntu covers 3.9
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional test dependencies
        run: python -m pip install numpy imageio
      - name: Run offline tests (no camera)
        run: python -B -m unittest discover -s tests -v
