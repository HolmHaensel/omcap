<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-M1 Capture</title>
<style>
:root{--bg:#fff;--panel:#f5f5f5;--fg:#1a1a1a;--mut:#666;--line:#ddd;--acc:#0a5cc4;--warn:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--panel:#212121;--fg:#eee;--mut:#999;--line:#333;--acc:#6aa8ff;--warn:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
section{background:var(--panel);border-radius:8px;padding:12px}
#panels{display:flex;flex-direction:column;gap:12px}
.mut{color:var(--mut)} .warn{color:var(--warn)} .sp{margin-left:auto}
button,select,input[type=number]{font:inherit;padding:5px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px}
input[type=number]{width:76px}
button{cursor:pointer} button.w{border-color:var(--warn)} button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.row label{display:flex;gap:4px;align-items:center}
#viewport{position:relative;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:74vh;margin:0 auto;touch-action:none}
#zoomLayer{position:absolute;inset:0;transform-origin:0 0}
#levelGauge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#live,#ovl,#grid,#afGrid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#ovl,#grid,#afGrid,#aidCv{pointer-events:none}
#aidCv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#histCv{position:absolute;left:8px;bottom:8px;width:160px;height:70px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);pointer-events:none}
#start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px}
#start h1{font-size:30px;font-weight:300;letter-spacing:.02em}
#tiles{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:16px;width:100%;justify-content:center}
@media(max-width:560px){#tiles{grid-template-columns:minmax(0,1fr)}}
.ctile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px 22px;background:var(--panel);border:2px solid var(--line);border-radius:10px;font-size:16px;color:var(--fg)}
.ctile svg{width:128px;height:72px;color:var(--mut)}
.ctile.sel{border-color:var(--acc)}
.ctile.sel svg{color:var(--acc)}
.ctile small{color:var(--mut);font-size:12px}
.ctile.found small{color:var(--acc)}
#startMsg{min-height:1.3em}
#afMark{display:none;position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:2px solid #fc3;border-radius:4px;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;pointer-events:none}
#timerCount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20vmin;font-weight:700;color:#fff;text-shadow:0 0 12px #000;pointer-events:none;z-index:2}
#lastShot{position:absolute;right:8px;bottom:8px;width:22%;max-height:30%;object-fit:contain;background:#000;border:2px solid #fff;border-radius:4px;cursor:pointer;z-index:3}
#msg{margin:8px 0 0;min-height:1.3em}
#props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#props label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut);min-width:0}
#props select{width:100%;padding:4px;color:var(--fg)}
#gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#gal figure{margin:0;font-size:11px;color:var(--mut);min-width:0;overflow-wrap:anywhere}
#gal img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
#gal button,#local button{font-size:11px;padding:2px 5px}
#local div{display:flex;gap:4px;align-items:center;padding:3px 0;font-size:12px}
#local span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;width:min(420px,calc(100vw - 32px))}
dialog h2{margin-top:12px}
.lr{display:flex;gap:6px;align-items:center;padding:2px 0}
.lr span{flex:1}
#galOv,#viewer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
#viewer{z-index:11;background:#000;color:#eee}
.galbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#viewer .galbar{border-color:#333}
#galBody{flex:1;overflow:auto;padding:8px;min-height:0}
.gidx{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:4/3;background:var(--panel);cursor:pointer;overflow:hidden;border-radius:3px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;font-size:11px;color:#fff;background:#0009;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calhead{color:var(--mut);font-size:12px;text-align:center;padding-bottom:4px}
.calgrid{max-width:1100px;margin:0 auto}
.calhead{max-width:1100px;margin:0 auto}
.cal0{aspect-ratio:4/3;background:var(--panel);opacity:.45;border-radius:3px;padding:3px 6px;font-size:12px;color:var(--mut)}
.tile .dn{position:absolute;left:0;top:0;padding:1px 6px;font-size:12px;font-weight:600;color:#fff;background:#0009;border-bottom-right-radius:3px}
.tile .ct{position:absolute;right:0;bottom:0;padding:1px 6px;font-size:11px;color:#fff;background:#0009;border-top-left-radius:3px}
#vImgBox{flex:1;min-height:0;position:relative}
#vImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#viewer button{background:#222;color:#eee;border-color:#444}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border-radius:12px;padding:3px 10px;font-size:12px}
body.single{background:#000;height:100vh;overflow:hidden}
body.webcam{cursor:none;display:flex;align-items:center;justify-content:center}
#single{width:100vw;height:100vh;object-fit:contain;display:block}
</style>
</head>
<body>
<img id="single" alt="" hidden>
<div id="start" hidden>
  <h1>E-M1 Capture</h1>
  <div id="tiles">
    <button class="ctile" data-conn="usb">
      <svg viewBox="0 0 128 72" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><rect x="4" y="26" width="38" height="28" rx="3"/><circle cx="23" cy="40" r="7"/><path d="M42 44h30"/><rect x="72" y="14" width="44" height="32" rx="2"/><path d="M64 58h60"/></svg>
      <span data-i18n="start.usb">USB connection</span>
      <small data-note="usb" data-i18n="start.searching">searching …</small>
    </button>
    <button class="ctile" data-conn="wifi">
      <svg viewBox="0 0 128 72" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><rect x="4" y="26" width="38" height="28" rx="3"/><circle cx="23" cy="40" r="7"/><path d="M48 22a12 12 0 0 1 12 12M48 10a24 24 0 0 1 24 24"/><rect x="72" y="14" width="44" height="32" rx="2"/><path d="M64 58h60"/></svg>
      <span data-i18n="start.wifi">Wi-Fi connection</span>
      <small data-note="wifi" data-i18n="start.searching">searching …</small>
    </button>
  </div>
  <button id="startGo" disabled data-i18n="start.connect">Connect</button>
  <p id="startMsg" class="mut"></p>
</div>
<div id="app" hidden>
<header>
  <h1>E-M1 Capture</h1>
  <span id="status" class="mut" data-i18n="app.connecting">connecting …</span>
  <button id="discon" class="sp" data-i18n="app.disconnect">Disconnect</button>
  <button id="poweroff" class="w" data-feat="poweroff" data-i18n="app.poweroff">Turn off camera</button>
  <button id="layoutBtn" data-i18n="app.layout">Customize layout</button>
  <button id="reset" class="w" data-i18n="app.reset" data-i18n-title="app.resetTitle">Reset camera</button>
</header>
<main>
<div>
  <div class="row">
    <button class="w" id="lvStart" data-i18n="lv.start">Start live view</button>
    <button id="lvStop" data-i18n="lv.stop">Stop</button>
    <label data-feat="lvsize"><span data-i18n="lv.size">Size</span> <select id="lvqty">
      <option>0320x0240</option><option>0640x0480</option><option selected>0800x0600</option><option>1024x0768</option><option>1280x0960</option>
    </select></label>
    <span id="lvSize" class="mut"></span>
    <span class="sp"></span>
    <button data-z="1">1×</button><button data-z="2">2×</button><button data-z="4">4×</button>
    <button id="popLive" data-i18n="lv.second">Second monitor</button>
  </div>
  <div id="viewport">
    <div id="zoomLayer">
      <img id="live" alt="">
      <img id="ovl" alt="" hidden>
      <canvas id="grid"></canvas>
      <canvas id="afGrid"></canvas>
      <canvas id="aidCv"></canvas>
      <div id="afMark"></div>
    </div>
    <canvas id="levelGauge"></canvas>
    <canvas id="histCv" width="160" height="70" hidden></canvas>
    <div id="timerCount" hidden></div>
    <img id="lastShot" alt="" hidden data-i18n-title="last.title">
    <div id="empty" data-i18n="lv.off">Live view off</div>
  </div>
  <p id="msg" class="mut" data-i18n="msg.ready">Ready.</p>
  <section id="lvTools" style="margin-top:8px" hidden>
    <div class="row">
      <label data-feat="level"><input type="checkbox" id="lvlOn" checked> <span data-i18n="lv.level">Level gauge</span></label>
      <span id="lvlInfo" class="mut" data-feat="level"></span>
      <label><span data-i18n="lv.grid">Displayed Grid</span> <select id="gridType"><option value="" data-i18n="lv.gridOff">Off</option><option value="thirds" data-i18n="lv.gridThirds">Rule of thirds</option><option value="cross" data-i18n="lv.gridCross">Crosshair</option><option value="mesh" data-i18n="lv.gridMesh">Grid</option></select></label>
      <label class="gridAdj" hidden>X <input type="range" id="gridX" min="-50" max="50" value="0"></label>
      <label class="gridAdj" hidden>Y <input type="range" id="gridY" min="-50" max="50" value="0"></label>
      <label><input type="checkbox" id="aidHist"> <span data-i18n="lv.hist">Histogram</span></label>
      <label><input type="checkbox" id="aidRgb"> <span data-i18n="lv.histRgb">RGB</span></label>
      <label><input type="checkbox" id="aidClip"> <span data-i18n="lv.clip">Highlight&amp;Shadow</span></label>
      <label><input type="checkbox" id="aidPeak"> <span data-i18n="lv.peak">Peaking</span></label>
      <label><span data-i18n="lv.peakColor">Peaking Settings</span> <select id="aidPeakCol"><option value="white" data-i18n="lv.peakWhite">White</option><option value="black" data-i18n="lv.peakBlack">Black</option><option value="red" data-i18n="lv.peakRed">Red</option><option value="yellow" data-i18n="lv.peakYellow">Yellow</option></select></label>
    </div>
    <div class="row" id="ovlRow" hidden>
      <label><span data-i18n="lv.overlay">Overlay</span> <input type="range" id="ovlOp" min="0" max="100" value="50"></label>
      <button id="ovlOff" data-i18n="lv.overlayRemove">Remove</button>
    </div>
  </section>
</div>
<div id="panels">
  <section data-id="shutter" data-label="Shutter button" data-i18n-label="panel.shutter">
    <h2 data-i18n="panel.shutter">Shutter button</h2>
    <div class="row">
      <button class="w" id="shoot" data-i18n="shutter.take">Take picture</button>
      <label><span data-i18n="timer.label">Self-timer</span> <select id="timerSel">
        <option value="0" data-i18n="timer.off">Off</option><option value="2" data-i18n="timer.s2">2 s</option><option value="12" data-i18n="timer.s12">12 s</option>
      </select></label>
      <button class="w" id="half" data-feat="stages" data-i18n="shutter.half">Press halfway</button>
    </div>
  </section>
  <section data-id="movie" data-label="Movie" data-i18n-label="panel.movie" data-feat="movie">
    <h2 data-i18n="panel.movie">Movie</h2>
    <div class="row">
      <button class="w" id="movStart" data-i18n="movie.start">Start recording</button>
      <button class="w" id="movStop" data-i18n="movie.stop" hidden>Stop recording</button>
      <span id="movTime" class="warn"></span>
    </div>
    <div class="row"><span id="movQuality" class="mut"></span></div>
  </section>
  <section data-id="af" data-label="AF Area" data-i18n-label="panel.af" data-feat="af_area">
    <h2 data-i18n="panel.af">AF Area</h2>
    <div class="row" id="afModes" data-feat="af_modes">
      <button class="w" data-af="33024" data-i18n="af.33024">All Targets</button>
      <button class="w" data-af="33025" data-i18n="af.33025">Single Target</button>
      <button class="w" data-af="33027" data-i18n="af.33027">Small Target</button>
      <button class="w" data-af="33026" data-i18n="af.33026">Group Target</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="afShow" checked> <span data-i18n="af.show">Show AF targets</span></label>
      <span id="afInfo" class="mut"></span>
    </div>
  </section>
  <section data-id="scp" data-label="LV super control panel" data-i18n-label="panel.scp">
    <h2><span data-i18n="panel.scp">LV super control panel</span> <button id="propsReload" style="font-size:11px;padding:1px 6px" data-i18n="scp.reload">reload</button></h2>
    <div id="props"></div>
    <div id="roProps" class="mut" hidden></div>
  </section>
  <section data-id="prog" data-label="Shooting options" data-i18n-label="panel.prog">
    <h2 data-i18n="panel.prog">Shooting options</h2>
    <div class="row" id="rowIv" hidden>
      <span data-i18n="prog.timelapse">Time lapse shooting</span>
      <label><span data-i18n="prog.frame">Frame</span> <input type="number" id="ivCount" min="1" max="999" value="10"></label>
      <label><span data-i18n="prog.interval">Interval Time</span> <input type="number" id="ivSec" min="5" value="10"> s</label>
      <button class="w" id="ivStart" data-i18n="prog.start">Start</button>
    </div>
    <div class="row" id="rowBr" hidden>
      <span>AE BKT</span>
      <select id="brFrames" aria-label="Frames" data-i18n-aria="prog.frames"><option value="3">3f</option><option value="5">5f</option><option value="7">7f</option></select>
      <select id="brStep" aria-label="Step" data-i18n-aria="prog.step"><option value="1">0.3EV</option><option value="2">0.7EV</option><option value="3" selected>1.0EV</option></select>
      <button class="w" id="brStart" data-i18n="prog.start">Start</button>
    </div>
    <div class="row" id="jobRow" hidden>
      <button id="jobStop" data-i18n="prog.stop">Stop</button>
      <span id="jobInfo" class="mut"></span>
    </div>
    <div class="row" id="rowLong" hidden>
      <span id="longName"></span>
      <button class="w" id="takePrep" hidden data-i18n="prog.prepare">Prepare</button>
      <button class="w" id="takeStart" data-i18n="prog.start">Start</button><button class="w" id="takeStop" data-i18n="prog.stop">Stop</button>
      <span id="takeInfo" class="mut"></span>
    </div>
  </section>
  <section data-id="transfer" data-label="Save to" data-i18n-label="panel.transfer">
    <h2 data-i18n="panel.transfer">Save to</h2>
    <div class="row">
      <label><input type="radio" name="tr" value="sd" checked> <span data-i18n="transfer.sd">Card only</span></label>
      <label><input type="radio" name="tr" value="both"> <span data-i18n="transfer.both">Card and computer</span></label>
      <button id="popPhoto" data-i18n="transfer.popPhoto">Picture on second monitor</button>
    </div>
    <div id="trErr" class="warn"></div>
  </section>
  <section data-id="card" data-label="Playback" data-i18n-label="panel.card" data-feat="playback">
    <h2 data-i18n="panel.card">Playback</h2>
    <div class="row"><button id="galOpen" data-i18n="card.index">Index display</button><button id="reload" data-i18n="card.reload">Reload</button><span id="count" class="mut"></span></div>
    <div id="gal"></div>
  </section>
  <section data-id="local" data-label="Pictures on the computer" data-i18n-label="panel.local">
    <h2 data-i18n="local.title">On the computer</h2>
    <div id="local"></div>
  </section>
</div>
</main>
</div>
<div id="galOv" hidden>
  <div class="galbar">
    <strong data-i18n="panel.card">Playback</strong>
    <span id="galCount" class="mut"></span>
    <span id="galChip" class="chip" hidden></span>
    <span class="sp"></span>
    <button data-v="4">4</button><button data-v="9">9</button><button data-v="25">25</button><button data-v="100">100</button>
    <button data-v="cal" data-i18n="card.calendar">Calendar display</button>
    <button id="galShare" data-feat="share_order" data-i18n="card.share">Share Order</button>
    <button id="galShareSave" data-feat="share_order" data-i18n="card.shareSave" hidden>Save all to computer</button>
    <button id="galShareReset" data-feat="share_order" data-i18n="card.shareReset" hidden>Reset Share Order</button>
    <button id="galReload" data-i18n="card.reload">Reload</button>
    <button id="galClose" data-i18n="card.close">Close</button>
  </div>
  <div id="galBody"></div>
</div>
<div id="viewer" hidden>
  <div class="galbar">
    <button id="vPrev" aria-label="Previous picture" data-i18n-aria="card.prev">‹</button><button id="vNext" aria-label="Next picture" data-i18n-aria="card.next">›</button>
    <span id="vInfo"></span>
    <span class="sp"></span>
    <button id="vGet" data-i18n="card.saveToMac">Save to computer</button><button id="vOvl" data-i18n="card.overlay">Overlay</button><button id="vClose" data-i18n="card.close">Close</button>
  </div>
  <div id="vImgBox"><img id="vImg" alt=""></div>
</div>
<dialog id="layoutDlg"><form method="dialog">
  <div id="layoutBody"></div>
  <div class="row" style="margin-top:12px"><button data-i18n="layout.close">Close</button><button type="button" id="layoutReset" data-i18n="layout.reset">Reset</button></div>
</form></dialog>
<script>
const $=s=>document.querySelector(s);

      keys fall back to en). Terms as in the manual EM1_VER4_Eng.pdf.
      Server messages are English; with a key 'srv.<message>' they can be translated.
      Language: localStorage 'omcap.lang', else browser language, else en. */
const I18N={en:{

  "lv.level": "Level gauge",
  "lv.grid": "Displayed Grid",
  "lv.gridOff": "Off",
  "lv.gridThirds": "Rule of thirds",
  "lv.gridCross": "Crosshair",
  "lv.gridMesh": "Grid",
  "lv.overlay": "Overlay",
  "lv.overlayRemove": "Remove",
  "lv.noSignal": "no signal for {s} s",
  "lv.receiving": "receiving {w}×{h}",
  "lv.hist": "Histogram",
  "lv.histRgb": "RGB",
  "lv.clip": "Highlight&Shadow",
  "lv.peak": "Peaking",
  "lv.peakColor": "Peaking Settings",
  "lv.peakWhite": "White",
  "lv.peakBlack": "Black",
  "lv.peakRed": "Red",
  "lv.peakYellow": "Yellow",
  "lv.roll": "Roll {a}° · Pitch {b}°",
  "msg.ready": "Ready.",
  "msg.indexing": "Reading the card index (once per USB session, about 1 min) …",
  "msg.indexDone": "Card index read: pictures are now saved quickly",
  "msg.lvRunning": "Live view running",
  "msg.lvStopped": "Live view stopped",
  "msg.settingsNeedRec": "Settings can only be read in shooting mode: start live view",
  "msg.focusing": "Focusing …",

  "msg.outsideAf": "Outside the AF Area",
  "msg.overlaySet": "Overlay set",

  "msg.taken": "Picture taken",
  "msg.shutter": "Shutter button",
  "msg.reset": "Reset done",
  "msg.rereading": "Re-reading the camera …",
  "msg.updated": "Camera state updated",
  "msg.stopping": "Stopping",
  "msg.saveTo": "Save to",
  "msg.openedWs": "Opened in OM Workspace",
  "msg.started": "{name} started",

  $('#half').classList.toggle('on',st.stage>=1);
  $('#empty').hidden=st.live;
  const w=$('#live').naturalWidth, stale=st.live&&st.lv_age>3;

  blank=st.live&&!stale&&$('#live').complete&&!w?blank+1:0;
  if(blank>=2){blank=0;$('#live').src='/live.mjpg?'+Date.now()}
  const off=st.live&&w&&st.lvqty&&w!==parseInt(st.lvqty,10);
  $('#lvSize').textContent=stale?tr('lv.noSignal',{s:Math.round(st.lv_age)}):st.live&&w?tr('lv.receiving',{w,h:$('#live').naturalHeight}):'';
  $('#lvSize').className=off||stale?'warn':'mut';
  const j=st.job;
  $('#jobInfo').textContent=j.name?tr('prog.job',{name:j.name,done:j.done,total:j.total})+(j.running?tr('prog.running'):'')+(j.error?tr('prog.error',{e:j.error}):''):'';
  $('#jobRow').hidden=!j.name; $('#jobStop').hidden=!j.running;

  const rec=st.movie!=null;

  $('#movTime').textContent=rec?tr('movie.time',{t:clock(st.movie)}):'';
  $('#trErr').textContent=st.transfer_error||'';

  applyContext();

  // camera still in mode "play" but playback closed (e.g. after reloading the page): back to shooting
  if(st.play&&$('#galOv').hidden&&!leavingPlay){leavingPlay=true;api('/api/playback',{action:'leave'}).catch(()=>{}).finally(()=>{leavingPlay=false;props()})}
  drawAf();
  // busy: a shooting sequence is still running (Wi-Fi: mode switch, transfer to the Mac)
  // USB: card directory is read after connecting (about 1 min), then the lens from the newest JPG
  if(st.indexing&&!wasIndexing) msg(tr('msg.indexing'));

async function loadLens(){
  // USB: the card list only comes on a button press, the server fetches the newest JPG itself

    try{const l=(await api('/api/lens')).lens; if(l&&(l.model||!lens||!lens.model)){lens=l;lensFrom='usb';showStatus();renderProps()}}catch{}

  }
  const s=cardShots&&cardShots.find(s=>isJpg(s.preview));
  if(!s||s.preview.path===lensFrom) return;
  try{lens=(await api('/api/lens?path='+encodeURIComponent(s.preview.path))).lens;lensFrom=s.preview.path;showStatus();renderProps()}catch{}
}

const fileQ=f=>'path='+encodeURIComponent(f.path)+(f.size?'&size='+f.size:'');

/* Date and time are in FAT format in get_imglist */
function parseStamp(e){const d=e.date,t=e.time;return{y:(d>>9)+1980,m:(d>>5)&15,d:d&31,h:t>>11,mi:(t>>5)&63}}
const pad=n=>String(n).padStart(2,'0');
/* Merge RAW and JPG of a shot into one entry, as on the camera */
function groupShots(files){
  const m=new Map();
  for(const f of files){
    const stem=f.name.replace(/\.[^.]+$/,''), k=f.dir+'/'+stem.toUpperCase();
    if(!m.has(k)) m.set(k,{name:stem,files:[]});
    m.get(k).files.push(f);
  }
  return [...m.values()].map(s=>{
    const p=s.files.find(f=>/\.jpe?g$/i.test(f.name))||s.files[0], dt=parseStamp(p);
    return {...s,preview:p,dt,day:`${dt.y}-${pad(dt.m)}-${pad(dt.d)}`,month:`${dt.y}-${pad(dt.m)}`,
      types:s.files.map(f=>f.name.split('.').pop().toUpperCase()).join('+'),
      size:s.files.reduce((a,f)=>a+f.size,0)};
  });
}

  report(tr('card.onMac',{name:s.name,types:s.types}));

async function gallery(force){

  if(!r.ok) return null;
  const u=URL.createObjectURL(await r.blob()); thumbs.set(url,u);
  // limit memory: release the oldest entries (images already shown stay visible)

const vp=$('#viewport'),layer=$('#zoomLayer');
function applyZoom(){

}

  const a=af.area,X=a.x0/a.w*c.width,Y=a.y0/a.h*c.height,W=(a.x1-a.x0)/a.w*c.width,H=(a.y1-a.y0)/a.h*c.height,cw=W/9,ch=H/9;
  const row=Math.floor((af.field-1)/9),col=(af.field-1)%9;
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=d; g.setLineDash([3*d,3*d]);
  if(af.mode===33027){
    // Small Target: 81 individual small squares, as on the camera display
    const s=Math.min(cw,ch)*.75, box=(r,k)=>[X+(k+.5)*cw-s/2,Y+(r+.5)*ch-s/2,s,s];
    for(let r=0;r<9;r++)for(let k=0;k<9;k++) if(r!==row||k!==col) g.strokeRect(...box(r,k));
    g.setLineDash([]); g.strokeStyle='#3f3'; g.lineWidth=3*d;
    g.strokeRect(...box(row,col));
    return;
  }
  g.beginPath();
  for(let i=0;i<=9;i++){g.moveTo(X+i*cw,Y);g.lineTo(X+i*cw,Y+H);g.moveTo(X,Y+i*ch);g.lineTo(X+W,Y+i*ch)}
  g.stroke();
  g.setLineDash([]); g.strokeStyle='#3f3'; g.lineWidth=2*d;
  if(af.mode===33024){
    if(focusHit&&Date.now()<focusHit.until){
      const r=Math.floor((focusHit.field-1)/9),k=(focusHit.field-1)%9;
      g.strokeRect(X+k*cw,Y+r*ch,cw,ch);
    }else g.strokeRect(X,Y,W,H);
    return;
  }
  // Group Target: 3x3 around the field, clipped at the edge
  const n=af.mode===33026?1:0;
  const r0=Math.max(0,row-n),r1=Math.min(8,row+n),c0=Math.max(0,col-n),c1=Math.min(8,col+n);
  for(let r=r0;r<=r1;r++)for(let k=c0;k<=c1;k++)g.strokeRect(X+k*cw,Y+r*ch,cw,ch);
}

/* Grid */
function drawGrid(){
  const c=$('#grid'),r=vp.getBoundingClientRect(),d=devicePixelRatio||1;
  c.width=r.width*d; c.height=r.height*d;
  const g=c.getContext('2d'),W=c.width,H=c.height,t=$('#gridType').value;
  document.querySelectorAll('.gridAdj').forEach(e=>e.hidden=!t);
  const ox=+$('#gridX').value/100,oy=+$('#gridY').value/100;
  g.strokeStyle='rgba(255,255,255,.65)'; g.lineWidth=d;
  const line=(a,b,e,f)=>{g.beginPath();g.moveTo(a,b);g.lineTo(e,f);g.stroke()};
  const v=x=>line(x*W,0,x*W,H), h=y=>line(0,y*H,W,y*H);
  if(t==='thirds'){v(1/3+ox);v(2/3+ox);h(1/3+oy);h(2/3+oy)}
  if(t==='cross'){v(.5+ox);h(.5+oy)}
  if(t==='mesh'){for(let i=0;i<10;i++){v((i/10+ox+1)%1);h((i/10+oy+1)%1)}}
}
['gridType','gridX','gridY'].forEach(i=>$('#'+i).oninput=drawGrid);
/* Display aids: computed in the browser from the live image, no camera commands */
function lumaHistogram(data){ // Rec.709, 256 bins
  const h=new Uint32Array(256);
  for(let i=0;i<data.length;i+=4) h[Math.min(255,Math.round(.2126*data[i]+.7152*data[i+1]+.0722*data[i+2]))]++;
  return h;
}
function rgbHistogram(data){
  const h=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)];
  for(let i=0;i<data.length;i+=4){h[0][data[i]]++;h[1][data[i+1]]++;h[2][data[i+2]]++}
  return h;
}
function clipMask(data,hi,lo){ // 1 = highlights (one channel >= hi), 2 = shadows (all channels <= lo)
  const m=new Uint8Array(data.length>>2);
  for(let i=0,j=0;i<data.length;i+=4,j++){
    const r=data[i],g=data[i+1],b=data[i+2];
    if(r>=hi||g>=hi||b>=hi) m[j]=1; else if(r<=lo&&g<=lo&&b<=lo) m[j]=2;
  }
  return m;
}
function grayOf(data){
  const g=new Float32Array(data.length>>2);
  for(let i=0,j=0;i<data.length;i+=4,j++) g[j]=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];
  return g;
}
function edgeMagnitude(gray,w,h){ // Sobel, border stays 0
  const m=new Float32Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x,a=gray[i-w-1],b=gray[i-w],c=gray[i-w+1],d=gray[i-1],f=gray[i+1],e=gray[i+w-1],g=gray[i+w],k=gray[i+w+1];
    const gx=(c+2*f+k)-(a+2*d+e),gy=(e+2*g+k)-(a+2*b+c);
    m[i]=Math.sqrt(gx*gx+gy*gy);
  }
  return m;
}
function edgeThreshold(mag,top,floor){ // threshold such that about the fraction top of the pixels lies above it
  let max=0; for(let i=0;i<mag.length;i++) if(mag[i]>max) max=mag[i];
  if(max<=0) return Infinity;
  const bins=new Uint32Array(256),k=255/max;
  for(let i=0;i<mag.length;i++) bins[Math.min(255,Math.floor(mag[i]*k))]++;
  let acc=0,b=255; const want=mag.length*top;
  for(;b>0;b--){acc+=bins[b]; if(acc>=want) break}
  return Math.max(floor,b/k);
}
const AID_KEY='omcap.aids', AID_IDS=['aidHist','aidRgb','aidClip','aidPeak'];
const aidOff=document.createElement('canvas'), aidCtx=aidOff.getContext('2d',{willReadFrequently:true});
const PEAK_RGB={white:[255,255,255],black:[0,0,0],red:[255,40,40],yellow:[255,230,0]};
function aidSave(){try{const o={col:$('#aidPeakCol').value};AID_IDS.forEach(i=>o[i]=$('#'+i).checked);localStorage.setItem(AID_KEY,JSON.stringify(o))}catch{}}
(()=>{try{const o=JSON.parse(localStorage.getItem(AID_KEY))||{};
  AID_IDS.forEach(i=>$('#'+i).checked=!!o[i]); if(PEAK_RGB[o.col]) $('#aidPeakCol').value=o.col}catch{}})();
function drawHist(data){
  const c=$('#histCv'),g=c.getContext('2d'),W=c.width,H=c.height;
  g.clearRect(0,0,W,H);
  const curve=(h,col)=>{
    let mx=1; for(let i=1;i<255;i++) if(h[i]>mx) mx=h[i]; // do not scale the edge bins
    g.strokeStyle=col; g.beginPath();
    for(let i=0;i<256;i++){const x=i/255*(W-1),y=H-1-Math.min(1,h[i]/mx)*(H-3);i?g.lineTo(x,y):g.moveTo(x,y)}
    g.stroke();
  };
  if($('#aidRgb').checked){const r=rgbHistogram(data);curve(r[0],'rgba(255,70,70,.9)');curve(r[1],'rgba(70,255,70,.9)');curve(r[2],'rgba(90,130,255,.9)')}
  const l=lumaHistogram(data);
  let mx=1; for(let i=1;i<255;i++) if(l[i]>mx) mx=l[i];
  g.fillStyle='rgba(255,255,255,.55)';
  for(let i=0;i<256;i++){const hh=Math.min(1,l[i]/mx)*(H-3);g.fillRect(i/255*(W-1),H-hh,Math.max(1,W/256),hh)}
}
function aidTick(){
  const wantH=$('#aidHist').checked,wantC=$('#aidClip').checked,wantP=$('#aidPeak').checked;
  const hc=$('#histCv'),oc=$('#aidCv'),img=$('#live'),nw=img.naturalWidth,nh=img.naturalHeight;
  hc.hidden=!(wantH&&st.live);
  if(!st.live||document.hidden||!(wantH||wantC||wantP)||!nw||!nh){
    if(oc.width) oc.getContext('2d').clearRect(0,0,oc.width,oc.height);
    return;
  }
  const w=Math.min(320,nw),h=Math.max(1,Math.round(w*nh/nw));
  if(aidOff.width!==w||aidOff.height!==h){aidOff.width=w;aidOff.height=h}
  let data;
  try{aidCtx.drawImage(img,0,0,w,h);data=aidCtx.getImageData(0,0,w,h).data}catch{return}
  if(wantH) drawHist(data);
  if(oc.width!==w||oc.height!==h){oc.width=w;oc.height=h}
  const og=oc.getContext('2d');
  if(!wantC&&!wantP){og.clearRect(0,0,w,h);return}
  const out=og.createImageData(w,h),o=out.data;
  if(wantC){
    const m=clipMask(data,250,5);
    for(let j=0;j<m.length;j++) if(m[j]){const k=j*4;o[k]=m[j]===1?255:30;o[k+1]=m[j]===1?30:80;o[k+2]=m[j]===1?30:255;o[k+3]=200}
  }
  if(wantP){
    const mag=edgeMagnitude(grayOf(data),w,h),t=edgeThreshold(mag,.03,24),c=PEAK_RGB[$('#aidPeakCol').value]||PEAK_RGB.white;
    for(let j=0;j<mag.length;j++) if(mag[j]>=t){const k=j*4;o[k]=c[0];o[k+1]=c[1];o[k+2]=c[2];o[k+3]=255}
  }
  og.putImageData(out,0,0);
}
AID_IDS.concat('aidPeakCol').forEach(i=>$('#'+i).onchange=()=>{aidSave();aidTick()});
setInterval(aidTick,250); // 4 frames/s are enough and keep the CPU low
new ResizeObserver(()=>{drawGrid();applyZoom();drawAf()}).observe(vp);

/* Adjust display */
const KEY='omcap.layout';
function loadLayout(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}
function saveLayout(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch{}}
let layout=loadLayout();
const GROUPS={panels:{title:tr('layout.panels'),el:$('#panels')},tiles:{title:tr('layout.settings'),el:$('#props')}};
function ordered(g){
  const items=[...GROUPS[g].el.children].filter(e=>e.dataset.id);
  const o=(layout[g]&&layout[g].order)||[];
  const pos=e=>{const i=o.indexOf(e.dataset.id);return i<0?o.length+items.indexOf(e):i};
  return items.sort((a,b)=>pos(a)-pos(b));
}
function applyLayout(){
  for(const g in GROUPS){
    const off=(layout[g]&&layout[g].off)||[];
    ordered(g).forEach((e,i)=>{e.style.order=i;e.hidden=off.includes(e.dataset.id)||(!!e.dataset.feat&&!features.has(e.dataset.feat))});
  }
}
function renderLayout(){
  const body=$('#layoutBody'); body.innerHTML='';
  for(const g in GROUPS){
    const h=document.createElement('h2'); h.textContent=GROUPS[g].title; body.append(h);
    const items=ordered(g), ids=items.map(e=>e.dataset.id);
    layout[g]=layout[g]||{off:[]}; layout[g].off=layout[g].off||[];
    items.forEach((e,i)=>{
      const r=document.createElement('div'); r.className='lr';
      const c=document.createElement('input'); c.type='checkbox'; c.checked=!layout[g].off.includes(e.dataset.id);
      c.onchange=()=>{layout[g].off=layout[g].off.filter(x=>x!==e.dataset.id);if(!c.checked)layout[g].off.push(e.dataset.id);commit()};
      const n=document.createElement('span'); n.textContent=e.dataset.label;
      const mv=(t,d)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.disabled=!ids[i+d];
        b.onclick=()=>{[ids[i],ids[i+d]]=[ids[i+d],ids[i]];layout[g].order=ids;commit()};return b};
      r.append(c,n,mv('↑',-1),mv('↓',1)); body.append(r);
    });
  }
}
function commit(){saveLayout(layout);applyLayout();renderLayout()}
$('#layoutBtn').onclick=()=>{renderLayout();$('#layoutDlg').showModal()};
$('#layoutReset').onclick=()=>{layout={};commit()};

/* Buttons */
$('#lvStart').onclick=async()=>{
  try{await api('/api/liveview',{action:'start',lvqty:features.has('af_modes')&&!lvPicked?null:$('#lvqty').value});$('#live').src='/live.mjpg?'+Date.now();msg(tr('msg.lvRunning'));await tick();if(features.has('af_area'))loadAf();setTimeout(props,1500)}catch(e){msg(e.message,true)}};

/* Shooting: the whole sequence. If Halfway is just holding focus, press through from there and release,
      as on the real shutter button. All the way and release are merged into it. */
/* Self-timer: purely client-side countdown, then the normal take-picture path */
let timerId=null,timerRes=null;
function timerStop(){clearInterval(timerId);timerId=null;$('#timerCount').hidden=true}
function timerStart(sec){
  return new Promise(res=>{
    let n=sec; const box=$('#timerCount'); box.textContent=n; box.hidden=false; msg(tr('timer.running'));
    timerRes=res;
    timerId=setInterval(()=>{n--;if(n>0){box.textContent=n;return}timerStop();timerRes=null;res(true)},1000);
  });
}
/* Last shot thumbnail in the live view corner. Source: Wi-Fi reloads the card list (newest first);
   USB asks the server for the JPG the camera just reported; a JPG saved to the computer is preferred. */
let lastOpen=null;
async function showLast(before,retry,before2){
  const img=$('#lastShot'), n=retry|0;
  let shot=null,local=null;
  // a JPG saved to the computer is the quickest source and does not depend on the camera
  try{const lst=(await api('/api/state')).latest;
    if(lst&&/\.jpe?g$/i.test(lst)&&lst!==before) local='/captures/'+encodeURIComponent(lst)}catch{}
  try{
    {
      const p=(await api('/api/lastshot')).path;
      if(p&&p===before2) throw new Error('not yet on the card'); // Wi-Fi: still the previous picture
      if(p){const name=p.split('/').pop(),dir=p.slice(0,p.lastIndexOf('/')),d=new Date();
        const f={path:p,name,dir,size:0,date:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),time:(d.getHours()<<11)|(d.getMinutes()<<5)};
        shot={name:name.replace(/\.[^.]+$/,''),files:[f],preview:f,dt:parseStamp(f),types:'JPG',size:0}}
    }
  }catch{}
  const src=local||(shot&&thumbUrl(shot.preview));
  // Wi-Fi: right after a shot the card list may fail or lack the new file: try again (up to 3x, 4 s apart)
  if(!features.has('af_modes')&&!local&&!shot&&n<4) setTimeout(()=>showLast(before,n+1,before2),3000);
  if(!src) return;
  lastOpen=shot; img.src=src; img.hidden=false;
}
$('#lastShot').onclick=()=>{
  if(lastOpen) openViewer([lastOpen],0);
  else window.open($('#lastShot').src,'_blank');
};
$('#shoot').onclick=async()=>{
  if(timerId!==null){timerStop();timerRes&&timerRes(false);timerRes=null;msg(tr('timer.cancelled'));return}
  const sec=+$('#timerSel').value;
  if(sec&&!await timerStart(sec)) return;
  msg(tr('msg.shooting'));
  const latestBefore=st.latest, newestBefore=lastOpen&&lastOpen.preview.path||(cardShots&&(cardShots.find(x=>isJpg(x.preview))||{preview:{}}).preview.path);
  if(st.stage>=1){
    if(!await act(tr('msg.shutter'),'/api/shutter',{stage:2})) return;
    await act(tr('msg.taken'),'/api/shutter',{stage:0});
  }else if(!await act(tr('msg.taken'),'/api/shoot',{})) return;
  showLast(latestBefore,0,newestBefore);
  gallery();local();
  if(features.has('af_modes')) loadLens(); // USB: lens from the new JPG
  // Wi-Fi: the camera is still writing after the shot, the first list often lacks the new image
  if(!features.has('af_modes')) setTimeout(()=>gallery(),4000);
};
$('#half').onclick=async()=>{
  const pressing=st.stage<1;
  const j=await act(tr('msg.shutter'),'/api/shutter',{stage:st.stage>=1?0:1});
  if(!pressing||!j||!af||af.mode!==33024) return;
  // All Targets: show the focused field as long as Halfway is held
  af={...af,last_af:j.last_af};
  const hit=focusField(af);
  focusHit=hit?{field:hit,until:Infinity,held:true}:null;
  msg(hit?tr('msg.inFocus'):tr('msg.noFocus'),!hit);
  drawAf();
};

/* Start screen: USB and Wi-Fi equal, detected connection is preselected */
const LAST_KEY='omcap.connection';
function lastConn(){try{return localStorage.getItem(LAST_KEY)}catch{return null}}
let selected=null,pollTimer=null,polling=false,connecting=false;
function markSelected(){
  document.querySelectorAll('.ctile').forEach(t=>t.classList.toggle('sel',t.dataset.conn===selected));
  $('#startGo').disabled=!selected||connecting;
}
async function pollConn(){
  if(polling||connecting||connected) return;
  polling=true;
  try{
    const c=await api('/api/connections');
    if(c.connected){enterApp();return}
    for(const k of ['usb','wifi']){
      document.querySelector(`.ctile[data-conn=${k}]`).classList.toggle('found',c[k]);
      const name=c.names&&c.names[k];
      document.querySelector(`[data-note=${k}]`).textContent=c[k]?(name?tr('start.found',{name}):tr('start.foundCamera')):tr('start.notFound');
    }
    const last=lastConn();
    selected=c.usb&&c.wifi?(last==='usb'||last==='wifi'?last:null):c.usb?'usb':c.wifi?'wifi':null;
    markSelected();
  }catch{}finally{polling=false}
}
async function connectTo(kind){
  if(connecting) return;
  connecting=true; selected=kind; markSelected();
  $('#startMsg').className='mut'; $('#startMsg').textContent=tr('start.connecting');
  try{
    await api('/api/connect',{type:kind});
    try{localStorage.setItem(LAST_KEY,kind)}catch{}
    enterApp();
  }catch(e){$('#startMsg').className='warn';$('#startMsg').textContent=e.message}
  finally{connecting=false;markSelected()}
}
document.querySelectorAll('.ctile').forEach(t=>t.onclick=()=>connectTo(t.dataset.conn));
$('#startGo').onclick=()=>{if(selected)connectTo(selected)};
document.addEventListener('keydown',e=>{if(!$('#start').hidden&&e.key==='Enter'&&selected&&e.target.tagName!=='BUTTON')connectTo(selected)});
$('#poweroff').onclick=async()=>{if(!confirm(tr('app.poweroffConfirm')))return;try{await api('/api/poweroff',{})}catch(e){alert(e.message||e);return}location.reload()};
$('#discon').onclick=async()=>{try{await api('/api/disconnect',{})}catch{}location.reload()};
function init(){
  $('#start').hidden=false;
  pollConn();
  pollTimer=setInterval(pollConn,2500);
}
async function enterApp(){
  if(connected) return;
  connected=true; clearInterval(pollTimer);
  $('#start').hidden=true; $('#app').hidden=false;
  try{
    const s=await api('/api/status');
    canWrite=s.allow_write;
    features=new Set(s.features);
    document.querySelectorAll('[data-feat]').forEach(e=>{if(!e.dataset.id)e.hidden=!features.has(e.dataset.feat)});
    statusBase={model:s.model,conn:s.type==='usb'?'USB':'Wi-Fi',rights:canWrite?tr('app.write'):tr('app.readOnly')};
    showStatus();
    if(!canWrite) document.querySelectorAll('button.w').forEach(b=>b.hidden=true);
    await tick(); await props(); gallery(); loadDevice(true); if(features.has('af_modes')) loadLens();
    if(features.has('af_modes')||(features.has('af_area')&&st.live)) loadAf();
    if(canWrite&&!st.live) $('#lvStart').click();
    if(st.lvqty) $('#lvqty').value=st.lvqty;
    else if(features.has('af_modes')) $('#lvqty').value='1024x0768';
    if(st.live) $('#live').src='/live.mjpg?'+Date.now();
  }catch(e){$('#status').className='warn';$('#status').textContent=e.message}
  local(); applyLayout();
}
if(!view){init();setInterval(tick,1500)}
